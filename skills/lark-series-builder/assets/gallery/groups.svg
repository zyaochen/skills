<text x="672" y="202" font-size="13" fill="#646A73">620 TFLOPS</text>
<rect x="220" y="214" width="845" height="24" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="214" width="845" height="24" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="1073" y="232" font-size="13" fill="#646A73">1180 TFLOPS</text>
<text x="208" y="292" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">注意力 前向 8K</text>
<rect x="220" y="260" width="845" height="24" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="260" width="344" height="24" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="572" y="278" font-size="13" fill="#646A73">480 TFLOPS</text>
<rect x="220" y="290" width="845" height="24" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="290" width="723" height="24" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="951" y="308" font-size="13" fill="#646A73">1010 TFLOPS</text>
<text x="208" y="368" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">小 GEMM 512³</text>
<rect x="220" y="336" width="845" height="24" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
<rect x="220" y="336" width="150" height="24" rx="4" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
<text x="378" y="354" font-size="13" fill="#646A73">210 TFLOPS</text>
