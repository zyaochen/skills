<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<rect x="0" y="0" width="1200" height="540" rx="16" fill="#FAFBFD" stroke="#DEE0E3"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold">新一代矩阵指令在长序列注意力上领先最多，短 GEMM 上差距不大</text>
<text x="40" y="92" font-size="14" fill="#646A73">每组是一种负载，条形是两代指令的实测吞吐（TFLOPS），共用一把刻度</text>
<rect x="220" y="149" width="14" height="14" rx="3" fill="#8F959E" stroke="#8F959E" stroke-width="1"/>
