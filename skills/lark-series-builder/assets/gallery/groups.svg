<rect x="220" y="366" width="186" height="24" rx="4" fill="#3370FF" stroke="#3370FF" stroke-width="1"/>
<text x="414" y="384" font-size="13" fill="#646A73">260 TFLOPS</text>
<rect x="40" y="426" width="1120" height="49" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1"/>
<text x="56" y="455" font-size="15" fill="#1F2329">差距随负载变大而变大：小矩阵受发射和同步开销限制，新指令的吞吐优势用不上。</text>
<text x="40" y="516" font-size="12" fill="#646A73">来源：本 skill 示例数据，演示分组条形图的画法</text>
