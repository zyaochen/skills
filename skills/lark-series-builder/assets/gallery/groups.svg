<text x="432" y="160" font-size="13" fill="#646A73">新一代指令</text>
<text x="208" y="216" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">大 GEMM 8192³</text>
<rect x="220" y="184" width="845" height="24" rx="4" fill="#F2F3F5" stroke="#F2F3F5" stroke-width="1"/>
